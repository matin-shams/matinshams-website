<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matin Shams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #1a1a1a;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 5rem;
      max-width: 780px;
      width: 100%;
    }

    /* ── Left: photo + identity ── */
    .left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      flex-shrink: 0;
    }

    .photo {
      width: 148px;
      height: auto;
      display: block;
    }

    .identity {
      text-align: center;
    }

    .name {
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      font-weight: 400;
      color: #1a1a1a;
      letter-spacing: 0.01em;
    }

    /* ── Divider ── */
    .divider {
      width: 1px;
      height: 140px;
      background: #e4e4e0;
      flex-shrink: 0;
    }

    /* ── Right: nav ── */
    .right {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .nav-btn {
      display: block;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      padding: 0.3rem 0;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 400;
      color: #777;
      letter-spacing: 0.01em;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav-btn:hover,
    .nav-btn.active {
      color: #1a1a1a;
    }

    /* ── Contact card ── */
    .contact-card {
      display: none;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #e4e4e0;
    }

    .contact-card.open { display: block; }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.75rem;
      color: #555;
      text-decoration: none;
      padding: 0.25rem 0;
      transition: color 0.15s;
    }

    .contact-link:hover { color: #1a1a1a; }

    .contact-link svg {
      flex-shrink: 0;
      opacity: 0.55;
    }

    /* ── Responsive ── */
    @media (max-width: 580px) {
      .card {
        flex-direction: column;
        gap: 2.5rem;
        align-items: center;
        text-align: center;
      }

      .divider { width: 60px; height: 1px; }

      .right { align-items: center; }

      .contact-card { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">

      <div class="left">
        <img class="photo" src="assets/logos/matin.png" alt="Matin Shams" />
        <div class="identity">
          <div class="name">Matin Shams</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="right">
        <a class="nav-btn" href="cv.html">CV</a>
        <button class="nav-btn" id="contact-toggle" type="button">Contact</button>

        <div class="contact-card" id="contact-card">
          <a class="contact-link" href="mailto:matinshams81@gmail.com">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
            matinshams81@gmail.com
          </a>
          <a class="contact-link" href="https://github.com/matin-shams" target="_blank" rel="noopener">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            github.com/matin-shams
          </a>
        </div>
      </div>

    </div>
  </div>

  <script>
    var toggle = document.getElementById('contact-toggle');
    var card   = document.getElementById('contact-card');
    toggle.addEventListener('click', function () {
      var open = card.classList.toggle('open');
      toggle.classList.toggle('active', open);
    });
  </script>
</body>
</html>
