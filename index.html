<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matin Shams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111110;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Stage ──────────────────────────────────── */
    .stage {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 560px;
    }

    /* ── Identity (name + subtitle, centered) ───── */
    .identity {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    .identity-name {
      font-family: 'EB Garamond', serif;
      font-size: clamp(1.9rem, 3.2vw, 2.5rem);
      font-weight: 500;
      color: #e6e1d7;
      letter-spacing: -0.01em;
    }

    .identity-sub {
      font-size: 0.7rem;
      font-weight: 300;
      color: rgba(230, 225, 215, 0.3);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    /* ── Scattered nav words ─────────────────────── */
    .word {
      position: absolute;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      line-height: 1;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .word:hover {
      color: #c4a882 !important;
      opacity: 1 !important;
    }

    .w-cv {
      font-size: clamp(1.1rem, 1.8vw, 1.5rem);
      font-weight: 400;
      color: rgba(230, 225, 215, 0.88);
      top: 20%;
      left: 7%;
    }

    .w-research {
      font-size: clamp(0.85rem, 1.3vw, 1.05rem);
      font-weight: 300;
      color: rgba(230, 225, 215, 0.5);
      top: 13%;
      left: 62%;
    }

    .w-writing {
      font-size: clamp(0.8rem, 1.2vw, 0.98rem);
      font-weight: 300;
      color: rgba(230, 225, 215, 0.45);
      top: 58%;
      left: 72%;
    }

    .w-projects {
      font-size: clamp(0.95rem, 1.5vw, 1.2rem);
      font-weight: 400;
      color: rgba(230, 225, 215, 0.62);
      top: 70%;
      left: 9%;
    }

    .w-contact {
      font-size: clamp(0.8rem, 1.1vw, 0.92rem);
      font-weight: 300;
      color: rgba(230, 225, 215, 0.42);
      top: 82%;
      left: 57%;
    }

    /* ── Mobile: vertical stack ──────────────────── */
    @media (max-width: 600px) {
      .stage {
        height: auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4rem 2rem;
        gap: 1.8rem;
      }

      .identity {
        position: static;
        transform: none;
        white-space: normal;
        margin-bottom: 0.5rem;
      }

      .word {
        position: static;
        font-size: 1rem !important;
        font-weight: 400 !important;
        color: rgba(230, 225, 215, 0.65) !important;
        opacity: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage">

    <div class="identity">
      <div class="identity-name">Matin Shams</div>
      <div class="identity-sub">Mathematical Modelling &amp; Scientific Computing</div>
    </div>

    <a class="word w-cv"       href="cv.html">Curriculum Vitae</a>
    <a class="word w-research" href="#">Research</a>
    <a class="word w-writing"  href="#">Writing</a>
    <a class="word w-projects" href="#">Projects</a>
    <a class="word w-contact"  href="#">Contact</a>

  </div>
</body>
</html>
